name: Disposable Debian installer validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run exact installer inside disposable Debian 13
        run: |
          docker run --rm -e DISPOSABLE_CI=YES -v "$GITHUB_WORKSPACE:/repo:ro" debian:13-slim bash -c '
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends python3 python3-venv curl ca-certificates passwd util-linux
            bash /repo/ci/test-install.sh
          '
